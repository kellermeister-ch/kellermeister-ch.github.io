name: Build Pipeline

on:
  # Runs on pushes to main branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/accessing-contextual-information-about-workflow-runs#example-usage-of-the-steps-context
      - name: Determine build version
        run: |
          echo "PACKAGE_VERSION=$(jq -r '.version' package.json)" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "GITHUB_SHA_SHORT=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_ENV

      - name: Save build version
        run: echo "BUILD_VERSION=${{ env.PACKAGE_VERSION }}.${{ github.run_number }}-${{ env.BUILD_DATE }}-${{ env.GITHUB_SHA_SHORT }}" >> $GITHUB_ENV

      - name: Setup build time variables
        run: |
          echo "VITE_BUILD_VERSION=${{ env.BUILD_VERSION }}" >> .env

      - name: Build application
        run: npm run build
        env:
          # Set the base path for GitHub Pages
          # GitHub Pages serves at: https://<username>.github.io/<repo-name>/
          VITE_BASE_PATH: /

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          # Automatically enable GitHub Pages if not already enabled
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
